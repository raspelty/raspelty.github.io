<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizlet</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>
<body>
    <div id="root"></div>
    
    <!-- Load the original main.js but we'll fight it -->
    <script type="text/javascript" src="main.js"></script>
    
    <!-- AGGRESSIVE OVERRIDE - Keeps title as "Quizlet" -->
    <script>
        (function() {
            var correctTitle = "Quizlet";
            var correctIcon = "/favicon.ico";
            
            // Override document.title setter
            var originalTitleSetter = Object.getOwnPropertyDescriptor(Document.prototype, 'title').set;
            Object.defineProperty(document, 'title', {
                get: function() { return correctTitle; },
                set: function(value) { 
                    if (value !== correctTitle) {
                        console.log('Blocked title change to:', value);
                        return;
                    }
                    if (originalTitleSetter) {
                        originalTitleSetter.call(document, value);
                    }
                },
                configurable: true
            });
            
            // Force title every 10ms (extremely aggressive)
            setInterval(function() {
                if (document.title !== correctTitle) {
                    document.title = correctTitle;
                }
            }, 10);
            
            // Force favicon every 100ms
            setInterval(function() {
                var link = document.querySelector("link[rel*='icon']");
                if (!link || link.href.indexOf(correctIcon) === -1) {
                    var newLink = document.createElement("link");
                    newLink.type = "image/x-icon";
                    newLink.rel = "shortcut icon";
                    newLink.href = correctIcon;
                    document.getElementsByTagName('head')[0].appendChild(newLink);
                }
            }, 100);
        })();
    </script>
</body>
</html>
